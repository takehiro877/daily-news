<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="今日のニュース">
<title>📰 今日のニュースまとめ</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', sans-serif; background: #f0f2f5; color: #333; }
  .header { background: linear-gradient(135deg, #1a1a2e, #16213e); color: white; padding: 24px 16px 20px; text-align: center; }
  .header h1 { font-size: 20px; font-weight: 700; margin-bottom: 6px; }
  .header .date { font-size: 13px; opacity: 0.8; }
  .container { max-width: 640px; margin: 0 auto; padding: 16px; }
  .category { margin-bottom: 24px; }
  .category-title { font-size: 15px; font-weight: 700; padding: 8px 14px; border-radius: 20px; display: inline-block; margin-bottom: 12px; color: white; }
  .cat-domestic { background: #e74c3c; }
  .cat-world    { background: #2980b9; }
  .cat-economy  { background: #27ae60; }
  .cat-health   { background: #8e44ad; }
  .card { background: white; border-radius: 12px; padding: 16px; margin-bottom: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
  .card a { color: #1a1a2e; font-size: 15px; font-weight: 600; text-decoration: none; line-height: 1.4; display: block; margin-bottom: 6px; }
  .card a:hover { color: #2980b9; }
  .card p { font-size: 13px; color: #666; line-height: 1.6; }
  .loading { text-align: center; padding: 60px 20px; color: #999; font-size: 15px; }
  .footer { text-align: center; padding: 20px; font-size: 12px; color: #aaa; }
</style>
</head>
<body>
<div class="header">
  <h1>📰 今日のニュースまとめ</h1>
  <div class="date">読み込み中...</div>
</div>
<div class="container">
  <div class="loading">⏳ エージェントが毎朝6時にニュースを更新します</div>
</div>
<div class="footer">Powered by Claude</div>
<script>
  document.querySelector('.date').textContent = new Date().toLocaleDateString('ja-JP', {year:'numeric',month:'long',day:'numeric',weekday:'short'});
</script>
</body>
</html>
